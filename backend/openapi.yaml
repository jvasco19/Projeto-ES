openapi: 3.0.3
info:
  title: Workstream API
  version: 0.1.0
  description: API do Workstream (gestão de pedidos de funcionalidades e roadmap).

servers:
  - url: /api

tags:
  - name: Sistema
  - name: Autenticação
  - name: Produtos
  - name: Pedidos
  - name: Área do cliente
  - name: Equipas
  - name: Membros
  - name: Funcionalidades

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está a correr
      security: []
      responses:
        '200':
          description: A API está a correr
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cria uma conta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Já existe uma conta com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Já existe uma conta com esse email
                field: email

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Inicia sessão e devolve um token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email ou palavra-passe incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email ou palavra-passe incorretos
                field: null

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Devolve o utilizador com sessão e os seus produtos
      responses:
        '200':
          description: Utilizador e produtos com o papel em cada um
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}/my-role:
    get:
      tags: [Produtos]
      summary: Devolve o papel do utilizador neste produto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: O papel do utilizador no produto
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/MemberRole'
        '400':
          description: Id do produto inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Produto inválido
                field: productId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: O produto não existe ou o utilizador não é membro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Produto não encontrado
                field: null

  /products/{productId}/requests:
    post:
      tags: [Pedidos]
      summary: Submete um pedido de funcionalidade (US13)
      description: >
        Só para clientes do produto. Cria o pedido com o estado submitted,
        regista a primeira mudança de estado e a versão 1, numa só transação.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Campo obrigatório em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Escolhe uma categoria
                field: category
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotCustomer'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /products/{productId}/requests/public:
    get:
      tags: [Pedidos]
      summary: Lista os pedidos públicos do produto (US13, passo de pesquisa)
      description: >
        Usado antes de submeter, para o cliente ver se já existe um pedido parecido.
        Devolve no máximo 20 pedidos, do mais recente para o mais antigo.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: search
          in: query
          required: false
          description: Texto a procurar no título (sem distinguir maiúsculas)
          schema:
            type: string
          example: relatório
      responses:
        '200':
          description: Pedidos públicos do produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotCustomer'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /me/requests:
    get:
      tags: [Área do cliente]
      summary: Lista os pedidos do utilizador (US15)
      description: >
        Pedidos submetidos pelo utilizador com sessão, de todos os produtos,
        do mais recente para o mais antigo.
      responses:
        '200':
          description: Pedidos do utilizador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/requests/{id}:
    get:
      tags: [Área do cliente]
      summary: Detalhe de um pedido do utilizador (US15)
      description: >
        Devolve o pedido com os anexos, a release (se houver) e o percurso de estados.
        Só o autor do pedido o pode ver.
      parameters:
        - name: id
          in: path
          required: true
          description: Id do pedido
          schema:
            type: integer
          example: 6
      responses:
        '200':
          description: Detalhe do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRequestDetail'
        '400':
          description: O id não é um número inteiro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O id do pedido tem de ser um número inteiro
                field: id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O pedido pertence a outro utilizador (CA3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Este pedido não pertence à tua conta
                field: null
        '404':
          description: O pedido não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null

  /me/notifications:
    get:
      tags: [Área do cliente]
      summary: Notificações das mudanças de estado dos pedidos do utilizador
      description: >
        Mudanças de estado nos pedidos do utilizador feitas por outra pessoa,
        da mais recente para a mais antiga (no máximo 50).
      responses:
        '200':
          description: Notificações do utilizador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}/teams:
    get:
      tags: [Equipas]
      summary: Lista as equipas do produto, com a carga e os membros (US18)
      description: >
        A carga (load) é a soma dos story points das funcionalidades da equipa
        que ainda não estão concluídas. Só para a equipa do produto (não clientes).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Equipas do produto, por ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    post:
      tags: [Equipas]
      summary: Cria uma equipa no produto (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
            example:
              name: Mobile
              capacity: 20
      responses:
        '201':
          description: Equipa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          description: Nome em falta ou capacidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Indica o nome da equipa
                field: name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/TeamNameTaken'

  /products/{productId}/teams/{teamId}:
    patch:
      tags: [Equipas]
      summary: Edita o nome e/ou a capacidade de uma equipa (US18)
      description: Os campos que não forem enviados mantêm o valor atual.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
            example:
              capacity: 25
      responses:
        '200':
          description: Equipa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          description: Id, nome ou capacidade inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A capacidade tem de ser um número inteiro igual ou maior que 0
                field: capacity
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '409':
          $ref: '#/components/responses/TeamNameTaken'
    delete:
      tags: [Equipas]
      summary: Apaga uma equipa (US18)
      description: Os membros e as funcionalidades da equipa ficam sem equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: Equipa apagada
        '400':
          description: Id da equipa inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Id inválido
                field: teamId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/TeamNotFound'

  /products/{productId}/members:
    get:
      tags: [Membros]
      summary: Lista os membros da equipa do produto (US18)
      description: >
        Devolve os membros com papel product_manager, project_manager ou developer.
        Os clientes não aparecem: entram no produto pelo link, não pela equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Membros da equipa, por ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    post:
      tags: [Membros]
      summary: Convida (adiciona) ao produto uma pessoa que já tem conta (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Membro adicionado ao produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Email em falta, papel inválido ou equipa que não é deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Escolhe um papel válido
                field: role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          description: Não existe nenhuma conta com esse email (ou o produto não existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não existe nenhuma conta com esse email
                field: email
        '409':
          description: A pessoa já é membro do produto (com qualquer papel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Esta pessoa já é membro do produto
                field: email

  /products/{productId}/members/{userId}:
    patch:
      tags: [Membros]
      summary: Altera o papel e/ou a equipa de um membro (US18)
      description: >
        Os campos que não forem enviados mantêm o valor atual.
        teamId a null tira o membro da equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberInput'
            example:
              role: project_manager
              teamId: 1
      responses:
        '200':
          description: Membro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Id, papel ou equipa inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Equipa inválida
                field: teamId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastProductManager'
    delete:
      tags: [Membros]
      summary: Remove um membro do produto (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Membro removido
        '400':
          description: Id do membro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Id inválido
                field: userId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastProductManager'

  /products/{productId}/board:
    get:
      tags: [Funcionalidades]
      summary: Quadro das funcionalidades do produto (US11)
      description: >
        Todas as funcionalidades do produto, ordenadas pelo fluxo dos estados.
        canMove indica se quem pede pode mudar o estado (developer da equipa da funcionalidade).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Quadro do produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /products/{productId}/features/{featureId}:
    get:
      tags: [Funcionalidades]
      summary: Detalhe da funcionalidade com o histórico de estados (US11)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      responses:
        '200':
          description: Detalhe da funcionalidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDetail'
        '400':
          $ref: '#/components/responses/InvalidFeatureId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/FeatureNotFound'

  /products/{productId}/features/{featureId}/status:
    patch:
      tags: [Funcionalidades]
      summary: Muda o estado da funcionalidade um passo para a frente ou para trás (US11)
      description: >
        Só para developers da equipa da funcionalidade (CA3). Não se pode saltar estados
        no fluxo todo, in_progress, in_review, done (CA2). A mudança fica registada com a
        data e o autor (CA1). Devolve a funcionalidade atualizada, com o histórico.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFeatureStatusInput'
      responses:
        '200':
          description: Estado alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDetail'
        '400':
          description: Estado inválido, igual ao atual, ou salto de estados (CA2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: De "Por fazer" só podes passar para "Em curso"
                field: status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            O utilizador não é developer, ou a funcionalidade é de outra equipa
            ou não tem equipa (CA3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Esta funcionalidade está atribuída a outra equipa
                field: null
        '404':
          $ref: '#/components/responses/FeatureNotFound'
        '409':
          description: O estado foi alterado por outra pessoa entretanto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O estado foi alterado por outra pessoa. Atualiza a página.
                field: null

  /products/{productId}/features/{featureId}/story:
    get:
      tags: [User Stories]
      summary: User Story e critérios de aceitação de uma funcionalidade (US16)
      description: >
        Devolve o pedido de origem (se existir), a User Story (null se ainda não tiver)
        e os critérios de aceitação por ordem. Só para a equipa do produto (não clientes).
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      responses:
        '200':
          description: User Story da funcionalidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          $ref: '#/components/responses/InvalidFeatureId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/FeatureNotFound'
    post:
      tags: [User Stories]
      summary: Cria a User Story da funcionalidade (US16)
      description: >
        Só para o Product Manager. Se a funcionalidade veio de um pedido, o pedido
        tem de estar aprovado (approved, planned ou delivered) (CA3). Papel, objetivo
        e benefício são obrigatórios (CA4). A User Story fica ligada ao pedido através
        da funcionalidade (CA1). Cada funcionalidade só tem uma User Story.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryInput'
      responses:
        '201':
          description: User Story criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          description: Campo em falta, demasiado longo ou id inválido (CA4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Preenche o benefício
                field: benefit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nao tens permissao para esta acao
                field: null
        '404':
          $ref: '#/components/responses/FeatureNotFound'
        '409':
          description: O pedido de origem ainda não foi aprovado (CA3) ou a funcionalidade já tem User Story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O pedido tem de estar aprovado para criar a User Story
                field: null
    patch:
      tags: [User Stories]
      summary: Edita a User Story (US16)
      description: Só para o Product Manager. Os campos que não forem enviados mantêm o valor atual.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryUpdateInput'
            example:
              goal: ver as comissões de cada vendedor por mês
      responses:
        '200':
          description: User Story atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          description: Campo enviado vazio ou demasiado longo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Preenche o papel
                field: role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A funcionalidade não existe ou ainda não tem User Story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Esta funcionalidade ainda não tem User Story
                field: null

  /products/{productId}/features/{featureId}/story/criteria:
    post:
      tags: [User Stories]
      summary: Adiciona um critério de aceitação no fim da lista (US16, CA2)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionInput'
      responses:
        '201':
          description: Critério adicionado; devolve a User Story com todos os critérios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          description: Texto em falta ou demasiado longo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Preenche o critério
                field: text
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A funcionalidade não existe ou ainda não tem User Story
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/features/{featureId}/story/criteria/{criterionId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/FeatureId'
      - name: criterionId
        in: path
        required: true
        schema:
          type: integer
        example: 1
    patch:
      tags: [User Stories]
      summary: Edita o texto de um critério de aceitação (US16, CA2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionInput'
      responses:
        '200':
          description: Critério atualizado; devolve a User Story com todos os critérios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          description: Texto em falta, demasiado longo ou id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A funcionalidade, a User Story ou o critério não existem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Critério não encontrado
                field: null
    delete:
      tags: [User Stories]
      summary: Remove um critério de aceitação (US16, CA2)
      responses:
        '200':
          description: Critério removido; devolve a User Story com os critérios que restam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResult'
        '400':
          description: Id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A funcionalidade, a User Story ou o critério não existem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Critério não encontrado
                field: null

  /products/{productId}/triage:
    get:
      tags: [Análise de pedidos]
      summary: Lista os pedidos do produto para análise (US21)
      description: >
        Todos os pedidos do produto, do mais recente para o mais antigo, com os anexos,
        as etiquetas e as versões anteriores da descrição. A pesquisa e os filtros por
        estado são feitos no frontend. Só para o Product Manager.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Pedidos do produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriageRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nao tens permissao para esta acao
                field: null
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /products/{productId}/triage/{requestId}/review:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
        example: 8
    post:
      tags: [Análise de pedidos]
      summary: Abre um pedido para análise (US21)
      description: >
        Se o pedido estiver submitted, passa a in_review e a mudança fica registada
        (o cliente recebe a notificação). Noutro estado, devolve o pedido sem o alterar.
      responses:
        '200':
          description: Pedido (em análise, se estava submetido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageRequest'
        '400':
          description: Id do pedido inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O id do pedido tem de ser um numero inteiro
                field: requestId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: O pedido não existe neste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null

  /products/{productId}/triage/{requestId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
        example: 8
    patch:
      tags: [Análise de pedidos]
      summary: Edita a descrição, a categoria e a visibilidade de um pedido (US21, CA1)
      description: >
        Os campos que não forem enviados mantêm o valor atual. Se a descrição mudar,
        a anterior fica guardada como versão (aparece em versions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageUpdateInput'
            example:
              category: reports
              isPublic: true
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageRequest'
        '400':
          description: Descrição vazia, categoria inválida ou visibilidade que não é true/false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Escolhe uma categoria válida
                field: category
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: O pedido não existe neste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null

  /products/{productId}/triage/{requestId}/tags:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
        example: 8
    put:
      tags: [Análise de pedidos]
      summary: Substitui as etiquetas do pedido (US21, CA1)
      description: >
        A lista enviada passa a ser a lista completa de etiquetas do pedido (lista vazia
        remove todas). Etiquetas repetidas ou vazias são ignoradas. As etiquetas novas
        ficam disponíveis para os outros pedidos do produto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageTagsInput'
      responses:
        '200':
          description: Etiquetas guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageRequest'
        '400':
          description: Não é uma lista, mais de 10 etiquetas ou etiqueta com mais de 30 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No máximo 10 etiquetas por pedido
                field: tags
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: O pedido não existe neste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null

  /products/{productId}/triage/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
        example: 8
    post:
      tags: [Análise de pedidos]
      summary: Aprova um pedido em análise (US21, CA2)
      description: >
        O pedido passa a approved e fica disponível para entrar no Product Backlog.
        A mudança fica registada e o cliente recebe a notificação.
      responses:
        '200':
          description: Pedido aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageRequest'
        '400':
          description: Id do pedido inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O id do pedido tem de ser um numero inteiro
                field: requestId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: O pedido não existe neste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null
        '409':
          description: O pedido não está em análise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Só é possível aprovar um pedido que está em análise
                field: null

  /products/{productId}/triage/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
        example: 8
    post:
      tags: [Análise de pedidos]
      summary: Rejeita um pedido em análise com motivo (US21, CA3 e CA4)
      description: >
        O pedido passa a rejected e o motivo fica visível para o cliente (CA3).
        Sem motivo, o pedido mantém o estado (CA4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRejectInput'
      responses:
        '200':
          description: Pedido rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageRequest'
        '400':
          description: Motivo em falta (CA4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Indica o motivo da rejeição. O cliente vai vê-lo no pedido.
                field: reason
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Product Manager deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: O pedido não existe neste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null
        '409':
          description: O pedido não está em análise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Só é possível rejeitar um pedido que está em análise
                field: null

# Por defeito, todos os endpoints exigem o token
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
      example: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Id do utilizador (membro)
      schema:
        type: integer
      example: 8
    FeatureId:
      name: featureId
      in: path
      required: true
      schema:
        type: integer
      example: 3
  responses:
    BadRequest:
      description: Dados inválidos ou em falta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: A palavra-passe tem de ter pelo menos 8 caracteres
            field: password
    Unauthorized:
      description: Sem sessão, ou sessão inválida ou expirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Sessão em falta
            field: null
    NotCustomer:
      description: O utilizador é membro do produto, mas não é cliente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductNotFound:
      description: O produto não existe ou o utilizador não é membro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Produto não encontrado
            field: null

    NotTeamMember:
      description: O utilizador é cliente do produto, não faz parte da equipa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Nao tens permissao para esta acao
            field: null
    TeamNotFound:
      description: A equipa não existe neste produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Equipa não encontrada
            field: null
    TeamNameTaken:
      description: Já existe uma equipa com esse nome no produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Já existe uma equipa com esse nome
            field: name
    MemberNotFound:
      description: O membro não existe neste produto (ou é cliente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Membro não encontrado
            field: null
    LastProductManager:
      description: A alteração deixava o produto sem Product Manager
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: O produto tem de ter pelo menos um Product Manager
            field: null
    InvalidFeatureId:
      description: Id da funcionalidade inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Id inválido
            field: featureId
    FeatureNotFound:
      description: A funcionalidade não existe neste produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Funcionalidade não encontrada
            field: null
  schemas:
    Error:
      type: object
      required: [error, field]
      properties:
        error:
          type: string
          description: Mensagem para mostrar ao utilizador
        field:
          type: string
          nullable: true
          description: Campo com o problema, ou null se o erro não for de um campo

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Sara Gomes
        email:
          type: string
          format: email
          example: sara.gomes@exemplo.pt
        password:
          type: string
          minLength: 8
          example: password123

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ines.carvalho@exemplo.pt
        password:
          type: string
          example: password123

    User:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador (BIGINT, devolvido como texto)
          example: '1'
        name:
          type: string
          example: Inês Carvalho
        email:
          type: string
          example: ines.carvalho@exemplo.pt
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT a enviar no cabeçalho Authorization (Bearer)

    MemberRole:
      type: string
      enum: [customer, product_manager, project_manager, developer]

    ProductMembership:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Atlas CRM
        color:
          type: string
          nullable: true
          example: stream
        role:
          $ref: '#/components/schemas/MemberRole'

    RequestCategory:
      type: string
      enum: [reports, integrations, notifications, usability, performance, security]

    RequestStatus:
      type: string
      enum: [submitted, in_review, approved, planned, delivered, rejected]

    CreateRequestInput:
      type: object
      required: [title, description, category]
      properties:
        title:
          type: string
          example: Exportar relatórios para Excel
        description:
          type: string
          example: Preciso de exportar os relatórios mensais para os enviar à direção.
        category:
          $ref: '#/components/schemas/RequestCategory'
        currentWorkflow:
          type: string
          nullable: true
          description: Como o cliente faz isto hoje
          example: Copio os valores à mão para uma folha de cálculo.
        impact:
          type: string
          nullable: true
          description: Que diferença faz ter esta funcionalidade
          example: Poupa cerca de duas horas por mês.
        importance:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          example: 4

    Request:
      type: object
      properties:
        id:
          type: string
          description: Id do pedido (BIGINT, devolvido como texto)
          example: '13'
        productId:
          type: string
          example: '1'
        title:
          type: string
          example: Exportar relatórios para Excel
        description:
          type: string
        category:
          $ref: '#/components/schemas/RequestCategory'
        status:
          $ref: '#/components/schemas/RequestStatus'
        currentWorkflow:
          type: string
          nullable: true
        impact:
          type: string
          nullable: true
        importance:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    PublicRequest:
      type: object
      properties:
        id:
          type: string
          example: '4'
        title:
          type: string
          example: Exportar relatórios de vendas para Excel
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time

    MyRequest:
      type: object
      properties:
        id:
          type: string
          example: '6'
        title:
          type: string
          example: Relatório de comissões por vendedor
        status:
          $ref: '#/components/schemas/RequestStatus'
        productId:
          type: string
          example: '1'
        productName:
          type: string
          example: Atlas CRM
        createdAt:
          type: string
          format: date-time

    MyRequestDetail:
      type: object
      properties:
        id:
          type: string
          example: '6'
        title:
          type: string
          example: Relatório de comissões por vendedor
        description:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        category:
          $ref: '#/components/schemas/RequestCategory'
        rejectionReason:
          type: string
          nullable: true
          description: Motivo da rejeição (só quando o estado é rejected)
          example: null
        productId:
          type: string
          example: '1'
        productName:
          type: string
          example: Atlas CRM
        createdAt:
          type: string
          format: date-time
        release:
          type: string
          nullable: true
          description: Nome da release da funcionalidade criada a partir do pedido, ou null
          example: null
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MyRequestAttachment'
        timeline:
          type: array
          description: >
            Percurso completo do pedido. Normal: submitted, in_review, approved,
            planned, delivered. Rejeitado: submitted, in_review, rejected.
            Os passos que ainda não aconteceram têm a data a null.
          items:
            $ref: '#/components/schemas/TimelineStep'

    MyRequestAttachment:
      type: object
      properties:
        id:
          type: string
          example: '3'
        fileName:
          type: string
          example: modelo-comissoes.xlsx

    TimelineStep:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RequestStatus'
        date:
          type: string
          format: date-time
          nullable: true
          description: Data em que o pedido passou a este estado, ou null se ainda não passou

    Notification:
      type: object
      properties:
        id:
          type: string
          description: Id da mudança de estado
          example: '17'
        type:
          type: string
          enum: [status]
        requestId:
          type: string
          example: '6'
        requestTitle:
          type: string
          example: Relatório de comissões por vendedor
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        link:
          type: string
          example: /me/requests/6

    TeamInput:
      type: object
      properties:
        name:
          type: string
          example: Mobile
        capacity:
          type: integer
          minimum: 0
          description: Story points que a equipa consegue fazer (0 se não for indicada ao criar)
          example: 20

    TeamSummary:
      type: object
      properties:
        id:
          type: string
          example: '4'
        name:
          type: string
          example: Mobile
        capacity:
          type: integer
          example: 20

    TeamMember:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador
          example: '2'
        name:
          type: string
          example: Rui Matos
        role:
          $ref: '#/components/schemas/MemberRole'

    Team:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Core
        capacity:
          type: integer
          example: 40
        load:
          type: integer
          description: Soma dos story points das funcionalidades da equipa por concluir
          example: 34
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    TeamRole:
      type: string
      description: Papéis da equipa do produto (customer não)
      enum: [product_manager, project_manager, developer]

    Member:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador
          example: '8'
        name:
          type: string
          example: Joana Pires
        email:
          type: string
          example: joana.pires@exemplo.pt
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        joinedAt:
          type: string
          format: date-time

    InviteMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: sara.gomes@exemplo.pt
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: integer
          nullable: true
          description: Equipa do produto (opcional)
          example: 3

    UpdateMemberInput:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: integer
          nullable: true
          description: null para tirar o membro da equipa
          example: 1

    FeatureStatus:
      type: string
      description: Fluxo dos estados, por esta ordem
      enum: [todo, in_progress, in_review, done]

    BoardFeature:
      type: object
      properties:
        id:
          type: string
          example: '3'
        title:
          type: string
          example: Exportação de relatórios para Excel
        status:
          $ref: '#/components/schemas/FeatureStatus'
        storyPoints:
          type: integer
          nullable: true
          example: 8
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        assigneeId:
          type: string
          nullable: true
          example: '2'
        assigneeName:
          type: string
          nullable: true
          example: Rui Matos
        canMove:
          type: boolean
          description: true se quem pede é developer da equipa da funcionalidade
          example: true

    Board:
      type: object
      properties:
        myTeamId:
          type: string
          nullable: true
          description: Equipa de quem pede neste produto
          example: '1'
        features:
          type: array
          items:
            $ref: '#/components/schemas/BoardFeature'

    FeatureStatusChange:
      type: object
      properties:
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/FeatureStatus'
          nullable: true
          description: null na primeira entrada (criação)
        status:
          $ref: '#/components/schemas/FeatureStatus'
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          example: Rui Matos

    FeatureDetail:
      type: object
      properties:
        id:
          type: string
          example: '3'
        title:
          type: string
          example: Exportação de relatórios para Excel
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/FeatureStatus'
        storyPoints:
          type: integer
          nullable: true
          example: 8
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        assigneeId:
          type: string
          nullable: true
          example: '2'
        assigneeName:
          type: string
          nullable: true
          example: Rui Matos
        nextStatus:
          allOf:
            - $ref: '#/components/schemas/FeatureStatus'
          nullable: true
          description: Passo seguinte, ou null se já estiver concluída
        allowedStatuses:
          type: array
          description: Estados para onde pode passar (um passo para trás ou para a frente)
          items:
            $ref: '#/components/schemas/FeatureStatus'
          example: [todo, in_review]
        canChangeStatus:
          type: boolean
          example: true
        statusLog:
          type: array
          description: Mudanças de estado, da mais recente para a mais antiga
          items:
            $ref: '#/components/schemas/FeatureStatusChange'
        releaseName:
          type: string
          nullable: true
          description: Release a que a funcionalidade pertence (US10), ou null
          example: v3.0
        releaseObjective:
          type: string
          nullable: true
          description: Objetivo da release (US10, CA2)
          example: Relatórios e exportações para clientes empresariais

    ChangeFeatureStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/FeatureStatus'
      example:
        status: in_review

    StoryInput:
      type: object
      required: [role, goal, benefit]
      properties:
        role:
          type: string
          maxLength: 500
          description: Como...
          example: gestor comercial
        goal:
          type: string
          maxLength: 500
          description: Quero...
          example: ver as comissões por vendedor
        benefit:
          type: string
          maxLength: 500
          description: Para...
          example: pagar a cada um o valor certo

    StoryUpdateInput:
      type: object
      description: Só os campos enviados são alterados; não podem ficar vazios
      properties:
        role:
          type: string
          maxLength: 500
        goal:
          type: string
          maxLength: 500
        benefit:
          type: string
          maxLength: 500

    CriterionInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500
          example: Dado um mês, quando abro o relatório, então vejo cada vendedor.

    AcceptanceCriterion:
      type: object
      properties:
        id:
          type: string
          example: '4'
        position:
          type: integer
          description: Ordem na lista (pode ter falhas depois de remover critérios)
          example: 1
        text:
          type: string
          example: Dado um mês, quando abro o relatório, então vejo cada vendedor.

    UserStory:
      type: object
      properties:
        id:
          type: string
          example: '7'
        role:
          type: string
          example: gestor comercial
        goal:
          type: string
          example: ver as comissões por vendedor
        benefit:
          type: string
          example: pagar a cada um o valor certo
        state:
          type: string
          enum: [draft, confirmed]
          description: draft é um rascunho gerado por IA ainda por confirmar (US17)
          example: confirmed
        aiGenerated:
          type: boolean
          example: false
        createdBy:
          type: string
          example: Inês Carvalho
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoryResult:
      type: object
      properties:
        request:
          type: object
          nullable: true
          description: Pedido de origem da funcionalidade, ou null se foi criada pela equipa
          properties:
            id:
              type: string
              example: '6'
            title:
              type: string
              example: Relatório de comissões por vendedor
            description:
              type: string
              description: Texto do pedido original (US10, CA1)
            status:
              $ref: '#/components/schemas/RequestStatus'
            authorName:
              type: string
              example: Marta Lopes
            createdAt:
              type: string
              format: date-time
        story:
          allOf:
            - $ref: '#/components/schemas/UserStory'
          nullable: true
          description: null se a funcionalidade ainda não tem User Story
        criteria:
          type: array
          description: Critérios de aceitação por ordem
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'

    TriageRequest:
      type: object
      properties:
        id:
          type: string
          example: '8'
        title:
          type: string
          example: Autenticação com chave de segurança
        description:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        category:
          allOf:
            - $ref: '#/components/schemas/RequestCategory'
          nullable: true
        isPublic:
          type: boolean
          description: Se o pedido é visível para os outros clientes
          example: false
        rejectionReason:
          type: string
          nullable: true
          description: Motivo da rejeição (só quando o estado é rejected)
          example: null
        createdAt:
          type: string
          format: date-time
        authorName:
          type: string
          example: Ana Rodrigues
        statusChangedAt:
          type: string
          format: date-time
          description: Data da última mudança de estado (para os dias parados no estado)
        attachments:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
                example: '8'
              id:
                type: string
                example: '2'
              fileName:
                type: string
                example: politica-seguranca.pdf
        tags:
          type: array
          items:
            type: string
          example: [segurança, login]
        versions:
          type: array
          description: Versões anteriores da descrição, da mais recente para a mais antiga (sem a atual)
          items:
            type: object
            properties:
              requestId:
                type: string
                example: '8'
              version:
                type: integer
                example: 1
              title:
                type: string
              description:
                type: string
              createdAt:
                type: string
                format: date-time
              editedBy:
                type: string
                example: Ana Rodrigues

    TriageUpdateInput:
      type: object
      properties:
        description:
          type: string
          description: Não pode ficar vazia; a anterior fica guardada como versão
        category:
          allOf:
            - $ref: '#/components/schemas/RequestCategory'
          nullable: true
        isPublic:
          type: boolean

    TriageTagsInput:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
          example: [segurança, login]

    TriageRejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: Já existe uma funcionalidade planeada que resolve este problema.