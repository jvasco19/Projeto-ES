openapi: 3.0.3
info:
  title: Workstream API
  version: 0.1.0
  description: API do Workstream (gestão de pedidos de funcionalidades e roadmap).

servers:
  - url: /api

tags:
  - name: Sistema
  - name: Autenticação
  - name: Produtos
  - name: Pedidos
  - name: Área do cliente
  - name: Equipas
  - name: Membros
  - name: Funcionalidades

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está a correr
      security: []
      responses:
        '200':
          description: A API está a correr
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cria uma conta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Já existe uma conta com este email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Já existe uma conta com esse email
                field: email

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Inicia sessão e devolve um token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email ou palavra-passe incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email ou palavra-passe incorretos
                field: null

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Devolve o utilizador com sessão e os seus produtos
      responses:
        '200':
          description: Utilizador e produtos com o papel em cada um
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}/my-role:
    get:
      tags: [Produtos]
      summary: Devolve o papel do utilizador neste produto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: O papel do utilizador no produto
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: '#/components/schemas/MemberRole'
        '400':
          description: Id do produto inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Produto inválido
                field: productId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: O produto não existe ou o utilizador não é membro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Produto não encontrado
                field: null

  /products/{productId}/requests:
    post:
      tags: [Pedidos]
      summary: Submete um pedido de funcionalidade (US13)
      description: >
        Só para clientes do produto. Cria o pedido com o estado submitted,
        regista a primeira mudança de estado e a versão 1, numa só transação.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Campo obrigatório em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Escolhe uma categoria
                field: category
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotCustomer'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /products/{productId}/requests/public:
    get:
      tags: [Pedidos]
      summary: Lista os pedidos públicos do produto (US13, passo de pesquisa)
      description: >
        Usado antes de submeter, para o cliente ver se já existe um pedido parecido.
        Devolve no máximo 20 pedidos, do mais recente para o mais antigo.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: search
          in: query
          required: false
          description: Texto a procurar no título (sem distinguir maiúsculas)
          schema:
            type: string
          example: relatório
      responses:
        '200':
          description: Pedidos públicos do produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotCustomer'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /me/requests:
    get:
      tags: [Área do cliente]
      summary: Lista os pedidos do utilizador (US15)
      description: >
        Pedidos submetidos pelo utilizador com sessão, de todos os produtos,
        do mais recente para o mais antigo.
      responses:
        '200':
          description: Pedidos do utilizador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/requests/{id}:
    get:
      tags: [Área do cliente]
      summary: Detalhe de um pedido do utilizador (US15)
      description: >
        Devolve o pedido com os anexos, a release (se houver) e o percurso de estados.
        Só o autor do pedido o pode ver.
      parameters:
        - name: id
          in: path
          required: true
          description: Id do pedido
          schema:
            type: integer
          example: 6
      responses:
        '200':
          description: Detalhe do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRequestDetail'
        '400':
          description: O id não é um número inteiro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O id do pedido tem de ser um número inteiro
                field: id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O pedido pertence a outro utilizador (CA3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Este pedido não pertence à tua conta
                field: null
        '404':
          description: O pedido não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Pedido não encontrado
                field: null

  /me/notifications:
    get:
      tags: [Área do cliente]
      summary: Notificações das mudanças de estado dos pedidos do utilizador
      description: >
        Mudanças de estado nos pedidos do utilizador feitas por outra pessoa,
        da mais recente para a mais antiga (no máximo 50).
      responses:
        '200':
          description: Notificações do utilizador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}/teams:
    get:
      tags: [Equipas]
      summary: Lista as equipas do produto, com a carga e os membros (US18)
      description: >
        A carga (load) é a soma dos story points das funcionalidades da equipa
        que ainda não estão concluídas. Só para a equipa do produto (não clientes).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Equipas do produto, por ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    post:
      tags: [Equipas]
      summary: Cria uma equipa no produto (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
            example:
              name: Mobile
              capacity: 20
      responses:
        '201':
          description: Equipa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          description: Nome em falta ou capacidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Indica o nome da equipa
                field: name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/TeamNameTaken'

  /products/{productId}/teams/{teamId}:
    patch:
      tags: [Equipas]
      summary: Edita o nome e/ou a capacidade de uma equipa (US18)
      description: Os campos que não forem enviados mantêm o valor atual.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
            example:
              capacity: 25
      responses:
        '200':
          description: Equipa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          description: Id, nome ou capacidade inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A capacidade tem de ser um número inteiro igual ou maior que 0
                field: capacity
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/TeamNotFound'
        '409':
          $ref: '#/components/responses/TeamNameTaken'
    delete:
      tags: [Equipas]
      summary: Apaga uma equipa (US18)
      description: Os membros e as funcionalidades da equipa ficam sem equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: Equipa apagada
        '400':
          description: Id da equipa inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Id inválido
                field: teamId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/TeamNotFound'

  /products/{productId}/members:
    get:
      tags: [Membros]
      summary: Lista os membros da equipa do produto (US18)
      description: >
        Devolve os membros com papel product_manager, project_manager ou developer.
        Os clientes não aparecem: entram no produto pelo link, não pela equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Membros da equipa, por ordem alfabética
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    post:
      tags: [Membros]
      summary: Convida (adiciona) ao produto uma pessoa que já tem conta (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Membro adicionado ao produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Email em falta, papel inválido ou equipa que não é deste produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Escolhe um papel válido
                field: role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          description: Não existe nenhuma conta com esse email (ou o produto não existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Não existe nenhuma conta com esse email
                field: email
        '409':
          description: A pessoa já é membro do produto (com qualquer papel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Esta pessoa já é membro do produto
                field: email

  /products/{productId}/members/{userId}:
    patch:
      tags: [Membros]
      summary: Altera o papel e/ou a equipa de um membro (US18)
      description: >
        Os campos que não forem enviados mantêm o valor atual.
        teamId a null tira o membro da equipa.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberInput'
            example:
              role: project_manager
              teamId: 1
      responses:
        '200':
          description: Membro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Id, papel ou equipa inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Equipa inválida
                field: teamId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastProductManager'
    delete:
      tags: [Membros]
      summary: Remove um membro do produto (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Membro removido
        '400':
          description: Id do membro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Id inválido
                field: userId
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastProductManager'

  /products/{productId}/board:
    get:
      tags: [Funcionalidades]
      summary: Quadro das funcionalidades do produto (US11)
      description: >
        Todas as funcionalidades do produto, ordenadas pelo fluxo dos estados.
        canMove indica se quem pede pode mudar o estado (developer da equipa da funcionalidade).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Quadro do produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /products/{productId}/features/{featureId}:
    get:
      tags: [Funcionalidades]
      summary: Detalhe da funcionalidade com o histórico de estados (US11)
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      responses:
        '200':
          description: Detalhe da funcionalidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDetail'
        '400':
          $ref: '#/components/responses/InvalidFeatureId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/FeatureNotFound'

  /products/{productId}/features/{featureId}/status:
    patch:
      tags: [Funcionalidades]
      summary: Muda o estado da funcionalidade um passo para a frente ou para trás (US11)
      description: >
        Só para developers da equipa da funcionalidade (CA3). Não se pode saltar estados
        no fluxo todo, in_progress, in_review, done (CA2). A mudança fica registada com a
        data e o autor (CA1). Devolve a funcionalidade atualizada, com o histórico.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFeatureStatusInput'
      responses:
        '200':
          description: Estado alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDetail'
        '400':
          description: Estado inválido, igual ao atual, ou salto de estados (CA2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: De "Por fazer" só podes passar para "Em curso"
                field: status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            O utilizador não é developer, ou a funcionalidade é de outra equipa
            ou não tem equipa (CA3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Esta funcionalidade está atribuída a outra equipa
                field: null
        '404':
          $ref: '#/components/responses/FeatureNotFound'
        '409':
          description: O estado foi alterado por outra pessoa entretanto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: O estado foi alterado por outra pessoa. Atualiza a página.
                field: null

  /products:
    post:
      tags: [Produtos]
      summary: Cria um produto (US18, CA1)
      description: Quem cria o produto fica como Project Manager. É gerado o link para os clientes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedProduct'
        '400':
          description: Nome em falta ou demasiado longo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Dá um nome ao produto
                field: name
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}/milestones:
    get:
      tags: [Equipas]
      summary: Lista as milestones do produto por data de entrega (US18)
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Milestones do produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Milestone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotTeamMember'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    post:
      tags: [Equipas]
      summary: Cria uma milestone (US18, CA3 e CA4)
      description: Só para o Project Manager (CA5). A data de entrega não pode já ter passado (CA4).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
      responses:
        '201':
          description: Milestone criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Milestone'
        '400':
          description: Nome em falta, data inválida ou data que já passou (CA4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A data de entrega já passou
                field: dueDate
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: O utilizador não é Project Manager deste produto (CA5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nao tens permissao para esta acao
                field: null
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Já existe uma milestone com esse nome no produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Já existe uma milestone com esse nome
                field: name

# Por defeito, todos os endpoints exigem o token
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
      example: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Id do utilizador (membro)
      schema:
        type: integer
      example: 8
    FeatureId:
      name: featureId
      in: path
      required: true
      schema:
        type: integer
      example: 3
  responses:
    BadRequest:
      description: Dados inválidos ou em falta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: A palavra-passe tem de ter pelo menos 8 caracteres
            field: password
    Unauthorized:
      description: Sem sessão, ou sessão inválida ou expirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Sessão em falta
            field: null
    NotCustomer:
      description: O utilizador é membro do produto, mas não é cliente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductNotFound:
      description: O produto não existe ou o utilizador não é membro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Produto não encontrado
            field: null

    NotTeamMember:
      description: O utilizador é cliente do produto, não faz parte da equipa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Nao tens permissao para esta acao
            field: null
    TeamNotFound:
      description: A equipa não existe neste produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Equipa não encontrada
            field: null
    TeamNameTaken:
      description: Já existe uma equipa com esse nome no produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Já existe uma equipa com esse nome
            field: name
    MemberNotFound:
      description: O membro não existe neste produto (ou é cliente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Membro não encontrado
            field: null
    LastProductManager:
      description: A alteração deixava o produto sem Product Manager
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: O produto tem de ter pelo menos um Product Manager
            field: null
    InvalidFeatureId:
      description: Id da funcionalidade inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Id inválido
            field: featureId
    FeatureNotFound:
      description: A funcionalidade não existe neste produto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Funcionalidade não encontrada
            field: null
  schemas:
    Error:
      type: object
      required: [error, field]
      properties:
        error:
          type: string
          description: Mensagem para mostrar ao utilizador
        field:
          type: string
          nullable: true
          description: Campo com o problema, ou null se o erro não for de um campo

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Sara Gomes
        email:
          type: string
          format: email
          example: sara.gomes@exemplo.pt
        password:
          type: string
          minLength: 8
          example: password123

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ines.carvalho@exemplo.pt
        password:
          type: string
          example: password123

    User:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador (BIGINT, devolvido como texto)
          example: '1'
        name:
          type: string
          example: Inês Carvalho
        email:
          type: string
          example: ines.carvalho@exemplo.pt
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT a enviar no cabeçalho Authorization (Bearer)

    MemberRole:
      type: string
      enum: [customer, product_manager, project_manager, developer]

    ProductMembership:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Atlas CRM
        color:
          type: string
          nullable: true
          example: stream
        role:
          $ref: '#/components/schemas/MemberRole'

    RequestCategory:
      type: string
      enum: [reports, integrations, notifications, usability, performance, security]

    RequestStatus:
      type: string
      enum: [submitted, in_review, approved, planned, delivered, rejected]

    CreateRequestInput:
      type: object
      required: [title, description, category]
      properties:
        title:
          type: string
          example: Exportar relatórios para Excel
        description:
          type: string
          example: Preciso de exportar os relatórios mensais para os enviar à direção.
        category:
          $ref: '#/components/schemas/RequestCategory'
        currentWorkflow:
          type: string
          nullable: true
          description: Como o cliente faz isto hoje
          example: Copio os valores à mão para uma folha de cálculo.
        impact:
          type: string
          nullable: true
          description: Que diferença faz ter esta funcionalidade
          example: Poupa cerca de duas horas por mês.
        importance:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          example: 4

    Request:
      type: object
      properties:
        id:
          type: string
          description: Id do pedido (BIGINT, devolvido como texto)
          example: '13'
        productId:
          type: string
          example: '1'
        title:
          type: string
          example: Exportar relatórios para Excel
        description:
          type: string
        category:
          $ref: '#/components/schemas/RequestCategory'
        status:
          $ref: '#/components/schemas/RequestStatus'
        currentWorkflow:
          type: string
          nullable: true
        impact:
          type: string
          nullable: true
        importance:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    PublicRequest:
      type: object
      properties:
        id:
          type: string
          example: '4'
        title:
          type: string
          example: Exportar relatórios de vendas para Excel
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time

    MyRequest:
      type: object
      properties:
        id:
          type: string
          example: '6'
        title:
          type: string
          example: Relatório de comissões por vendedor
        status:
          $ref: '#/components/schemas/RequestStatus'
        productId:
          type: string
          example: '1'
        productName:
          type: string
          example: Atlas CRM
        createdAt:
          type: string
          format: date-time

    MyRequestDetail:
      type: object
      properties:
        id:
          type: string
          example: '6'
        title:
          type: string
          example: Relatório de comissões por vendedor
        description:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        category:
          $ref: '#/components/schemas/RequestCategory'
        rejectionReason:
          type: string
          nullable: true
          description: Motivo da rejeição (só quando o estado é rejected)
          example: null
        productId:
          type: string
          example: '1'
        productName:
          type: string
          example: Atlas CRM
        createdAt:
          type: string
          format: date-time
        release:
          type: string
          nullable: true
          description: Nome da release da funcionalidade criada a partir do pedido, ou null
          example: null
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MyRequestAttachment'
        timeline:
          type: array
          description: >
            Percurso completo do pedido. Normal: submitted, in_review, approved,
            planned, delivered. Rejeitado: submitted, in_review, rejected.
            Os passos que ainda não aconteceram têm a data a null.
          items:
            $ref: '#/components/schemas/TimelineStep'

    MyRequestAttachment:
      type: object
      properties:
        id:
          type: string
          example: '3'
        fileName:
          type: string
          example: modelo-comissoes.xlsx

    TimelineStep:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RequestStatus'
        date:
          type: string
          format: date-time
          nullable: true
          description: Data em que o pedido passou a este estado, ou null se ainda não passou

    Notification:
      type: object
      properties:
        id:
          type: string
          description: Id da mudança de estado
          example: '17'
        type:
          type: string
          enum: [status]
        requestId:
          type: string
          example: '6'
        requestTitle:
          type: string
          example: Relatório de comissões por vendedor
        status:
          $ref: '#/components/schemas/RequestStatus'
        createdAt:
          type: string
          format: date-time
        link:
          type: string
          example: /me/requests/6

    TeamInput:
      type: object
      properties:
        name:
          type: string
          example: Mobile
        capacity:
          type: integer
          minimum: 0
          description: Story points que a equipa consegue fazer (0 se não for indicada ao criar)
          example: 20

    TeamSummary:
      type: object
      properties:
        id:
          type: string
          example: '4'
        name:
          type: string
          example: Mobile
        capacity:
          type: integer
          example: 20

    TeamMember:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador
          example: '2'
        name:
          type: string
          example: Rui Matos
        role:
          $ref: '#/components/schemas/MemberRole'

    Team:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Core
        capacity:
          type: integer
          example: 40
        load:
          type: integer
          description: Soma dos story points das funcionalidades da equipa por concluir
          example: 34
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    TeamRole:
      type: string
      description: Papéis da equipa do produto (customer não)
      enum: [product_manager, project_manager, developer]

    Member:
      type: object
      properties:
        id:
          type: string
          description: Id do utilizador
          example: '8'
        name:
          type: string
          example: Joana Pires
        email:
          type: string
          example: joana.pires@exemplo.pt
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        joinedAt:
          type: string
          format: date-time

    InviteMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: sara.gomes@exemplo.pt
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: integer
          nullable: true
          description: Equipa do produto (opcional)
          example: 3

    UpdateMemberInput:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
        teamId:
          type: integer
          nullable: true
          description: null para tirar o membro da equipa
          example: 1

    FeatureStatus:
      type: string
      description: Fluxo dos estados, por esta ordem
      enum: [todo, in_progress, in_review, done]

    BoardFeature:
      type: object
      properties:
        id:
          type: string
          example: '3'
        title:
          type: string
          example: Exportação de relatórios para Excel
        status:
          $ref: '#/components/schemas/FeatureStatus'
        storyPoints:
          type: integer
          nullable: true
          example: 8
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        assigneeId:
          type: string
          nullable: true
          example: '2'
        assigneeName:
          type: string
          nullable: true
          example: Rui Matos
        canMove:
          type: boolean
          description: true se quem pede é developer da equipa da funcionalidade
          example: true

    Board:
      type: object
      properties:
        myTeamId:
          type: string
          nullable: true
          description: Equipa de quem pede neste produto
          example: '1'
        features:
          type: array
          items:
            $ref: '#/components/schemas/BoardFeature'

    FeatureStatusChange:
      type: object
      properties:
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/FeatureStatus'
          nullable: true
          description: null na primeira entrada (criação)
        status:
          $ref: '#/components/schemas/FeatureStatus'
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          example: Rui Matos

    FeatureDetail:
      type: object
      properties:
        id:
          type: string
          example: '3'
        title:
          type: string
          example: Exportação de relatórios para Excel
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/FeatureStatus'
        storyPoints:
          type: integer
          nullable: true
          example: 8
        teamId:
          type: string
          nullable: true
          example: '1'
        teamName:
          type: string
          nullable: true
          example: Core
        assigneeId:
          type: string
          nullable: true
          example: '2'
        assigneeName:
          type: string
          nullable: true
          example: Rui Matos
        nextStatus:
          allOf:
            - $ref: '#/components/schemas/FeatureStatus'
          nullable: true
          description: Passo seguinte, ou null se já estiver concluída
        allowedStatuses:
          type: array
          description: Estados para onde pode passar (um passo para trás ou para a frente)
          items:
            $ref: '#/components/schemas/FeatureStatus'
          example: [todo, in_review]
        canChangeStatus:
          type: boolean
          example: true
        statusLog:
          type: array
          description: Mudanças de estado, da mais recente para a mais antiga
          items:
            $ref: '#/components/schemas/FeatureStatusChange'

    ChangeFeatureStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/FeatureStatus'
      example:
        status: in_review

    CreateProductInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
          example: Atlas CRM
        description:
          type: string
          nullable: true
          example: CRM para equipas comerciais de PME.

    CreatedProduct:
      type: object
      properties:
        id:
          type: string
          example: '6'
        name:
          type: string
          example: Atlas CRM
        description:
          type: string
          nullable: true
        color:
          type: string
          example: stream
        linkToken:
          type: string
          description: Código do link que a equipa partilha com os clientes (/r/{linkToken})
          example: atl-3F9A1C
        role:
          type: string
          enum: [project_manager]

    MilestoneInput:
      type: object
      required: [name, dueDate]
      properties:
        name:
          type: string
          example: Entrega da versão 3
        dueDate:
          type: string
          format: date
          description: Não pode ser anterior a hoje (CA4)
          example: '2027-01-31'

    Milestone:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: Entrega da versão 3
        dueDate:
          type: string
          format: date
          example: '2027-01-31'